<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4d6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동 체크">
<title>오늘의 운동 체크리스트</title>
<style>
:root{
  --run:#ff6b35; --run-soft:#fff1eb;
  --plank:#7c5cff; --plank-soft:#f0ecff;
  --bike:#00b894; --bike-soft:#e3f9f4;
  --ink:#1d2140; --muted:#727890; --line:#d3d7e0; --bg:#e2e5eb; --card:#f0f2f5; --inner:#f7f8fa; --chip:#e4e7ed;
  --tab-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  padding-bottom:calc(var(--tab-h) + 28px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
.app{max-width:560px;margin:0 auto}

/* HERO */
.hero{
  background:linear-gradient(135deg,#ff6b35 0%,#ff3d71 55%,#7c5cff 100%);
  color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 66px;border-radius:0 0 30px 30px;position:relative;overflow:hidden;
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:200px;height:200px;right:-60px;top:-80px}
.hero::after{width:120px;height:120px;left:-40px;bottom:-50px}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.hero h1{font-size:21px;font-weight:800;letter-spacing:-.5px}
.pill-btn{background:rgba(255,255,255,.25);padding:10px 16px;min-height:40px;border-radius:99px;font-weight:800;font-size:14px}
.pill-btn:active{background:rgba(255,255,255,.4)}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0;position:relative;z-index:1}
.month-nav button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);font-size:26px;font-weight:700;line-height:1}
.month-nav button:active{background:rgba(255,255,255,.42);transform:scale(.95)}
#monthLabel{font-size:24px;font-weight:800;letter-spacing:-.5px}

/* STATS (가로 스크롤) */
.stats{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;
  margin-top:-46px;padding:2px 16px 14px;position:relative;z-index:2;scrollbar-width:none;
}
.stats::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 auto;min-width:118px;scroll-snap-align:start;
  background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 8px 22px rgba(40,50,100,.10);
}
.stat .ico{font-size:19px}
.stat .v{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.5px;line-height:1.1;white-space:nowrap}
.stat .v small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:4px;white-space:nowrap}

/* VIEWS */
.view{display:none;padding:0 14px}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:24px;padding:18px 16px;box-shadow:0 6px 22px rgba(40,50,100,.07);margin-bottom:14px}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}

/* DATE STRIP */
.stripwrap{margin:0 -14px 12px}
.strip{
  display:flex;gap:8px;overflow-x:auto;padding:10px 18px 14px;scrollbar-width:none;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;cursor:grab;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
}
.strip.drag{cursor:grabbing;scroll-snap-type:none}
.sday .mo{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:800;color:var(--run)}
.sday.sel .mo{color:#fff}
.sday.first{margin-left:6px}
.sday.first .w{margin-top:6px}
.strip::-webkit-scrollbar{display:none}
.sday{
  flex:0 0 auto;width:54px;height:74px;border-radius:18px;background:var(--card);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;scroll-snap-align:center;transition:.15s;position:relative;
}
.sday .w{font-size:11px;font-weight:700;color:var(--muted)}
.sday .n{font-size:18px;font-weight:800}
.sday .dots{height:6px}
.sday.today{box-shadow:inset 0 0 0 2px var(--run)}
.sday.sel{background:linear-gradient(160deg,#ff6b35,#ff3d71);color:#fff;box-shadow:0 6px 16px rgba(255,80,90,.35)}
.sday.sel .w{color:rgba(255,255,255,.85)}
.sday.sel.today{box-shadow:0 6px 16px rgba(255,80,90,.35)}
.sday.perfect::after{content:"⭐";position:absolute;top:-4px;right:-2px;font-size:12px}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%}
.sday.sel .dots i{box-shadow:0 0 0 1.5px #fff}

/* ENTRY */
.entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.badge-today{background:#fff1eb;color:var(--run);font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:2px}
.clear-btn{font-size:13px;font-weight:700;color:var(--muted);padding:0 14px;min-height:38px;border-radius:99px;background:var(--chip);white-space:nowrap}
.clear-btn:active{background:#ffe9ee;color:#ff3d71}
.ex{border-radius:22px;padding:14px;margin-bottom:12px;border:2px solid transparent;transition:.2s}
.ex.run{background:var(--run-soft)} .ex.plank{background:var(--plank-soft)} .ex.bike{background:var(--bike-soft)}
.ex.done.run{border-color:var(--run)} .ex.done.plank{border-color:var(--plank)} .ex.done.bike{border-color:var(--bike)}
.ex-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ex-name{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.ex-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--inner)}
.status{font-size:12px;font-weight:800;padding:6px 12px;border-radius:99px;background:var(--inner);color:var(--muted)}
.ex.done .status{color:#fff}
.ex.done.run .status{background:var(--run)} .ex.done.plank .status{background:var(--plank)} .ex.done.bike .status{background:var(--bike)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:var(--inner);border-radius:16px;padding:9px 10px 10px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);padding-left:2px}
.field .row{display:flex;align-items:baseline;gap:4px;padding:2px 2px 8px}
.field input{
  width:100%;border:none;outline:none;font-family:inherit;font-size:28px;font-weight:800;color:var(--ink);background:transparent;min-width:0;
  -moz-appearance:textfield;border-radius:0;
}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none}
.field input::placeholder{color:#cdd1e2}
.field .u{font-size:14px;font-weight:700;color:var(--muted)}
.step{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step button{height:44px;border-radius:12px;font-weight:800;font-size:15px;background:var(--chip);color:var(--ink)}
.step button:active{transform:scale(.94)}
.ex.run .step button:active{background:var(--run);color:#fff}
.ex.plank .step button:active{background:var(--plank);color:#fff}
.ex.bike .step button:active{background:var(--bike);color:#fff}
.field:focus-within{box-shadow:0 0 0 2px currentColor}
.ex.run .field:focus-within{color:var(--run)} .ex.plank .field:focus-within{color:var(--plank)} .ex.bike .field:focus-within{color:var(--bike)}
.field:focus-within input{color:var(--ink)}
.hint{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:10px;min-height:17px}
.savestat{text-align:center;font-size:12px;font-weight:700;color:#9aa0b8;margin:2px 0 16px}
.savestat.warn{color:#ff3d71;background:#ffe9ee;padding:10px 12px;border-radius:14px}

/* CALENDAR */
.legend{display:flex;gap:12px;margin:10px 0 14px;font-size:12px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .dow:first-child{color:#ff5c7a}
.day{
  aspect-ratio:1/1.12;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-weight:700;font-size:15px;background:var(--chip);position:relative;
}
.day:active{transform:scale(.94)}
.day.today{box-shadow:inset 0 0 0 2px #ff6b35}
.day.sel{background:linear-gradient(135deg,#ff6b35,#ff3d71);color:#fff}
.day.sel.today{box-shadow:none}
.day.perfect::after{content:"⭐";position:absolute;top:-5px;right:-3px;font-size:11px}
.day .dots{height:6px}
.day.sel .dots i{box-shadow:0 0 0 1.5px #fff}

/* CHART */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tab{padding:11px 4px;min-height:46px;border-radius:14px;font-weight:800;font-size:14px;background:var(--chip);color:var(--muted)}
.tab.on{color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.14)}
.tab.on[data-ex=run]{background:var(--run)} .tab.on[data-ex=plank]{background:var(--plank)} .tab.on[data-ex=bike]{background:var(--bike)}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-top:10px}
.seg:empty{display:none}
.seg button{flex:1;min-height:40px;border-radius:11px;font-size:14px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--inner);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 4px}
.chip{background:var(--chip);border-radius:14px;padding:10px}
.chip .l{font-size:11px;font-weight:700;color:var(--muted)}
.chip .v{font-size:15px;font-weight:800;margin-top:3px;letter-spacing:-.3px;word-break:keep-all}
.readout{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin:10px 2px 4px}
.readout b{color:var(--ink)}
.go-btn{background:#1d2140;color:#fff;font-size:12px;font-weight:800;padding:0 13px;min-height:34px;border-radius:99px;white-space:nowrap}
.svgwrap{margin-top:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
svg{display:block;width:100%;height:auto}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}
.noanim .bar{animation:none}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.empty{text-anchor:middle;font-size:13px;fill:#b4b9cf;font-weight:700}

.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 14px 0}
.foot button,.foot label{background:var(--card);padding:0 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted);box-shadow:0 4px 14px rgba(40,50,100,.06);cursor:pointer}
.note{text-align:center;font-size:11.5px;color:#a9aec4;margin:12px 20px 0;font-weight:600;line-height:1.5}

/* TAB BAR */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(240,242,245,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;color:#a3a8bf}
.tabbar button .i{font-size:22px;filter:grayscale(1);opacity:.55;transition:.2s}
.tabbar button.on{color:#ff3d71}
.tabbar button.on .i{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;
  background:#1d2140;color:#fff;padding:13px 20px;border-radius:99px;font-weight:800;font-size:14px;
  transition:.3s;z-index:99;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:360px){
  .field input{font-size:24px}
  .chip .v{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-top">
      <h1>🔥 오늘의 운동</h1>
      <button class="pill-btn" id="todayBtn">오늘</button>
    </div>
    <div class="month-nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <div id="monthLabel"></div>
      <button id="next" aria-label="다음 달">›</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <!-- 기록 -->
  <section class="view on" id="v-log">
    <div class="stripwrap"><div class="strip" id="strip"></div></div>
    <div class="card">
      <div class="entry-head">
        <div>
          <h2 id="entryTitle"></h2>
          <div class="sub">입력하면 자동으로 저장돼요</div>
        </div>
        <button class="clear-btn" id="clearDay">이 날 지우기</button>
      </div>
      <div id="entryBody"></div>
    </div>
    <div class="savestat" id="saveStat"></div>
    <div class="foot">
      <button id="exportBtn">⬇️ 백업 저장</button>
      <label>⬆️ 백업 불러오기<input type="file" id="importFile" accept="application/json,.json" hidden></label>
    </div>
    <div class="note">기록은 이 기기의 브라우저에 자동 저장되어 새로고침하거나 앱을 껐다 켜도 유지돼요.<br>기기를 바꿀 때를 대비해 가끔 백업을 저장해 두세요.</div>
  </section>

  <!-- 달력 -->
  <section class="view" id="v-cal">
    <div class="card">
      <h2>📅 월간 달력</h2>
      <div class="sub">날짜를 누르면 그날 기록 화면으로 이동해요</div>
      <div class="legend">
        <span><i style="background:var(--run)"></i>달리기</span>
        <span><i style="background:var(--plank)"></i>플랭크</span>
        <span><i style="background:var(--bike)"></i>자전거</span>
        <span>⭐ 3종 완료</span>
      </div>
      <div class="cal" id="cal"></div>
    </div>
  </section>

  <!-- 그래프 -->
  <section class="view" id="v-chart">
    <div class="card">
      <h2>📈 <span id="chartTitle">월간 그래프</span></h2>
      <div class="sub">그래프를 누르거나 좌우로 쓸면 날짜별 기록을 볼 수 있어요</div>
      <div class="tabs" id="tabs"></div>
      <div class="seg" id="seg"></div>
      <div class="chips" id="chips"></div>
      <div class="readout"><div id="readout"></div><button class="go-btn" id="goLog">기록하기 ›</button></div>
      <div class="svgwrap" id="chart"></div>
    </div>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-in">
  <button data-tab="log" class="on"><span class="i">✅</span>기록</button>
  <button data-tab="cal"><span class="i">📅</span>달력</button>
  <button data-tab="chart"><span class="i">📈</span>그래프</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
(function(){
const LS='workout-checklist-v1';
const DOW=['일','월','화','수','목','금','토'];
const EX={
  run:{name:'달리기',icon:'🏃',color:'#ff6b35',color2:'#ff9a6b',fields:[
    {k:'min',label:'시간',unit:'분',d:5,mode:'numeric'},{k:'km',label:'거리',unit:'km',d:0.5,mode:'decimal'}]},
  plank:{name:'플랭크',icon:'🧘',color:'#7c5cff',color2:'#a995ff',fields:[
    {k:'min',label:'분',unit:'분',d:1,mode:'numeric'},{k:'sec',label:'초',unit:'초',d:10,mode:'numeric',max:59}]},
  bike:{name:'실내자전거',icon:'🚴',color:'#00b894',color2:'#55dcc0',fields:[
    {k:'min',label:'시간',unit:'분',d:5,mode:'numeric'},{k:'km',label:'거리',unit:'km',d:0.5,mode:'decimal'}]}
};
const KEYS=['run','plank','bike'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const keyOf=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const fmtNum=n=>Math.round(n*100)/100;
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- 저장소: localStorage + IndexedDB 이중 저장 ---------- */
let lsOk=true, idbOk=true;
function idbOpen(){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('workout-db',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e)}
  });
}
function idbSet(k,v){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k);
    tx.oncomplete=()=>{db.close();res()}; tx.onerror=()=>{db.close();rej(tx.error)};
  }));
}
function idbGet(k){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('kv','readonly'); const q=tx.objectStore('kv').get(k);
    q.onsuccess=()=>{db.close();res(q.result)}; q.onerror=()=>{db.close();rej(q.error)};
  }));
}
function loadLS(){
  try{const v=JSON.parse(localStorage.getItem(LS)); return (v&&typeof v==='object')?v:{}}
  catch(e){lsOk=false;return {}}
}
let data=loadLS();
function setSaveStatus(){
  const el=$('#saveStat'); if(!el) return;
  if(!lsOk&&!idbOk){
    el.className='savestat warn';
    el.textContent='⚠️ 이 환경에서는 저장이 안 돼요. 파일을 크롬/사파리 같은 브라우저로 직접 열어 사용해 주세요.';
  }else{
    const t=new Date();
    el.className='savestat';
    el.textContent='💾 자동 저장됨 · '+pad(t.getHours())+':'+pad(t.getMinutes());
  }
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify(data));lsOk=true}catch(e){lsOk=false}
  setSaveStatus();
  idbSet(LS,clone(data)).then(()=>{idbOk=true;setSaveStatus()}).catch(()=>{idbOk=false;setSaveStatus()});
}
// 브라우저가 저장소를 임의로 비우지 않도록 요청
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
// localStorage가 비어 있어도 IndexedDB에 남은 기록을 복구
idbGet(LS).then(d=>{
  if(d&&typeof d==='object'){
    let changed=false;
    Object.keys(d).forEach(k=>{ if(!data[k]){data[k]=d[k];changed=true} });
    if(changed){ try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){} renderAll(); }
  }
}).catch(()=>{idbOk=false;setSaveStatus()});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}} });

/* ---------- 상태 ---------- */
const now=new Date();
const todayKey=keyOf(now.getFullYear(),now.getMonth(),now.getDate());
let view={y:now.getFullYear(),m:now.getMonth()};
let sel=todayKey, tab='log';
let chartEx='run', chartMetric='km';

function isDone(ex,r){
  if(!r) return false;
  return ex==='plank' ? (r.min>0||r.sec>0) : (r.min>0||r.km>0);
}
function doneCount(k){const d=data[k]||{};return KEYS.filter(e=>isDone(e,d[e])).length}
function metricVal(ex,mk,r){
  if(!isDone(ex,r)) return 0;
  if(ex==='plank') return (r.min||0)*60+(r.sec||0);
  return mk==='km' ? (r.km||0) : (r.min||0);
}
function fmtSec(s){
  s=Math.round(s);
  if(s>=3600){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'시간 '+m+'분'}
  if(s>=60){const m=Math.floor(s/60),ss=s%60;return m+'분'+(ss?' '+ss+'초':'')}
  return s+'초';
}
function fmtSecAxis(s){
  if(s<60) return s+'초';
  if(s%60===0) return (s/60)+'분';
  return Math.floor(s/60)+':'+pad(s%60);
}
function fmtVal(ex,mk,v){
  if(ex==='plank') return fmtSec(v);
  return fmtNum(v)+(mk==='km'?' km':' 분');
}
function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function dotsOf(k){
  const rec=data[k]||{};
  return KEYS.filter(e=>isDone(e,rec[e])).map(e=>`<i style="background:${EX[e].color}"></i>`).join('');
}

/* ---------- 통계 ---------- */
function renderStats(){
  const n=daysIn(view.y,view.m);
  let active=0,runKm=0,plankSec=0,bikeKm=0;
  for(let d=1;d<=n;d++){
    const rec=data[keyOf(view.y,view.m,d)]; if(!rec) continue;
    if(KEYS.some(e=>isDone(e,rec[e]))) active++;
    if(isDone('run',rec.run)) runKm+=rec.run.km||0;
    if(isDone('plank',rec.plank)) plankSec+=(rec.plank.min||0)*60+(rec.plank.sec||0);
    if(isDone('bike',rec.bike)) bikeKm+=rec.bike.km||0;
  }
  let streak=0; const c=new Date();
  if(doneCount(keyOf(c.getFullYear(),c.getMonth(),c.getDate()))===0) c.setDate(c.getDate()-1);
  while(doneCount(keyOf(c.getFullYear(),c.getMonth(),c.getDate()))>0){streak++;c.setDate(c.getDate()-1)}
  const tiles=[
    ['📆',active,'일','이번 달 운동한 날'],
    ['🔥',streak,'일','연속 기록'],
    ['🏃',fmtNum(runKm),'km','달리기 누적'],
    ['🧘',fmtSec(plankSec),'','플랭크 누적'],
    ['🚴',fmtNum(bikeKm),'km','자전거 누적']
  ];
  $('#stats').innerHTML=tiles.map(t=>`<div class="stat"><div class="ico">${t[0]}</div><div class="v">${t[1]}${t[2]?`<small>${t[2]}</small>`:''}</div><div class="l">${t[3]}</div></div>`).join('');
}

/* ---------- 날짜 스트립 ---------- */
function renderStrip(center){
  const el=$('#strip'), prev=el.scrollLeft;
  // 이전 달 1일 ~ 다음 달 말일까지 이어서 스크롤
  const start=new Date(view.y,view.m-1,1), end=new Date(view.y,view.m+2,0);
  let h='';
  for(let dt=new Date(start); dt<=end; dt.setDate(dt.getDate()+1)){
    const y=dt.getFullYear(), m=dt.getMonth(), d=dt.getDate(), k=keyOf(y,m,d);
    const first=(d===1);
    h+=`<button class="sday ${first?'first':''} ${k===todayKey?'today':''} ${k===sel?'sel':''} ${doneCount(k)===3?'perfect':''}" data-k="${k}">
      ${first?`<span class="mo">${m+1}월</span>`:''}<span class="w">${DOW[dt.getDay()]}</span><span class="n">${d}</span><span class="dots">${dotsOf(k)}</span></button>`;
  }
  el.innerHTML=h;
  if(center) centerStrip(); else el.scrollLeft=prev;
}
function centerStrip(){
  const el=$('#strip'), s=el.querySelector('.sel'); if(!s||!el.clientWidth) return;
  el.scrollLeft=s.offsetLeft-el.clientWidth/2+s.clientWidth/2;
}

/* ---------- 달력 ---------- */
function renderCalendar(){
  $('#monthLabel').textContent=view.y+'년 '+(view.m+1)+'월';
  const first=new Date(view.y,view.m,1).getDay(), n=daysIn(view.y,view.m);
  let h=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div></div>';
  for(let d=1;d<=n;d++){
    const k=keyOf(view.y,view.m,d);
    h+=`<button class="day ${k===todayKey?'today':''} ${k===sel?'sel':''} ${doneCount(k)===3?'perfect':''}" data-k="${k}"><span>${d}</span><span class="dots">${dotsOf(k)}</span></button>`;
  }
  $('#cal').innerHTML=h;
}

/* ---------- 입력 ---------- */
function hintFor(ex,r){
  if(!isDone(ex,r)) return '';
  if(ex==='plank') return '⏱ 총 '+((r.min||0)*60+(r.sec||0))+'초';
  const min=r.min||0, km=r.km||0;
  if(min>0&&km>0){
    let p=min/km, pm=Math.floor(p), ps=Math.round((p-pm)*60);
    if(ps===60){pm++;ps=0}
    const sp=fmtNum(km/(min/60));
    return ex==='run' ? `⚡ 평균 페이스 ${pm}'${pad(ps)}"/km · 시속 ${sp}km` : `⚡ 평균 속도 시속 ${sp}km`;
  }
  return ex==='run' ? '시간과 거리를 모두 넣으면 페이스를 계산해요' : '시간과 거리를 모두 넣으면 평균 속도를 계산해요';
}
function fmtStep(d){return (d%1?'':'')+fmtNum(d)}
function renderEntry(){
  const [y,m,d]=sel.split('-').map(Number);
  const wd=DOW[new Date(y,m-1,d).getDay()];
  $('#entryTitle').innerHTML=`${m}월 ${d}일 (${wd})`+(sel===todayKey?'<span class="badge-today">TODAY</span>':'');
  const rec=data[sel]||{};
  $('#entryBody').innerHTML=KEYS.map(e=>{
    const x=EX[e], r=rec[e]||{}, done=isDone(e,r);
    const fields=x.fields.map(f=>{
      const v=r[f.k]>0?r[f.k]:'';
      return `<div class="field"><label>${f.label}</label><div class="row">
        <input type="number" inputmode="${f.mode}" min="0" ${f.max?`max="${f.max}"`:''} step="any" placeholder="0" enterkeyhint="done" data-ex="${e}" data-f="${f.k}" value="${v}">
        <span class="u">${f.unit}</span></div>
        <div class="step"><button type="button" data-ex="${e}" data-f="${f.k}" data-d="${-f.d}">−${fmtStep(f.d)}</button><button type="button" data-ex="${e}" data-f="${f.k}" data-d="${f.d}">+${fmtStep(f.d)}</button></div></div>`;
    }).join('');
    return `<div class="ex ${e} ${done?'done':''}" data-ex="${e}">
      <div class="ex-top"><div class="ex-name"><span class="ex-ico">${x.icon}</span>${x.name}</div>
      <span class="status">${done?'완료 ✓':'미기록'}</span></div>
      <div class="fields">${fields}</div><div class="hint">${hintFor(e,r)}</div></div>`;
  }).join('');
}
function updateEntryLive(){
  const rec=data[sel]||{};
  KEYS.forEach(e=>{
    const el=document.querySelector(`.ex[data-ex="${e}"]`); if(!el) return;
    const done=isDone(e,rec[e]);
    el.classList.toggle('done',done);
    el.querySelector('.status').textContent=done?'완료 ✓':'미기록';
    el.querySelector('.hint').textContent=hintFor(e,rec[e]);
  });
}
function applyValue(ex,f,v){
  if(!(v>0)) v=0;
  if(f==='sec'&&v>59) v=59;
  const before=doneCount(sel);
  if(!data[sel]) data[sel]={};
  if(!data[sel][ex]) data[sel][ex]={};
  data[sel][ex][f]=v;
  if(!isDone(ex,data[sel][ex])) delete data[sel][ex];
  if(!Object.keys(data[sel]).length) delete data[sel];
  save(); refreshLive();
  if(before<3&&doneCount(sel)===3){
    toast('🎉 오늘 운동 3종 완료! 대단해요!');
    try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}
  }
}

/* ---------- 그래프 ---------- */
function niceMax(max,ex){
  if(max<=0) return {step:ex==='plank'?15:2.5,top:ex==='plank'?60:10};
  const target=max/4; let step;
  if(ex==='plank'){
    step=[15,30,60,120,180,300,600,900,1800,3600].find(s=>s>=target)||3600;
  }else{
    const p=Math.pow(10,Math.floor(Math.log10(target))), f=target/p;
    step=(f<=1?1:f<=2?2:f<=5?5:10)*p;
  }
  return {step,top:step*Math.ceil(max/step)};
}
let chartGeom=null;
function renderChart(anim){
  if(anim===undefined) anim=true;
  const x=EX[chartEx], n=daysIn(view.y,view.m);
  $('#chartTitle').textContent=(view.m+1)+'월 '+x.name+' 기록';
  $('#tabs').innerHTML=KEYS.map(e=>`<button class="tab ${e===chartEx?'on':''}" data-ex="${e}">${EX[e].icon} ${EX[e].name}</button>`).join('');
  $('#seg').innerHTML=chartEx==='plank'?'':
    `<button data-m="km" class="${chartMetric==='km'?'on':''}">거리 (km)</button><button data-m="min" class="${chartMetric==='min'?'on':''}">시간 (분)</button>`;
  const mk=chartEx==='plank'?'sec':chartMetric;
  const vals=[]; let sum=0,cnt=0,best=0,bestD=0;
  for(let d=1;d<=n;d++){
    const r=(data[keyOf(view.y,view.m,d)]||{})[chartEx];
    const v=metricVal(chartEx,mk,r); vals.push(v);
    if(v>0){sum+=v;cnt++;if(v>best){best=v;bestD=d}}
  }
  const f=v=>fmtVal(chartEx,mk,v);
  $('#chips').innerHTML=[
    ['월 합계',f(sum)],
    ['평균',cnt?f(sum/cnt):'-'],
    ['최고',cnt?f(best)+`<span style="font-size:11px;color:var(--muted)"> ${bestD}일</span>`:'-']
  ].map(c=>`<div class="chip"><div class="l">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
  const sd=Number(sel.split('-')[2]), sv=vals[sd-1]||0;
  $('#readout').innerHTML=`${view.m+1}월 ${sd}일 · <b>${sv>0?f(sv):'기록 없음'}</b>`;

  const wrap=$('#chart');
  const W=Math.max(280,Math.round(wrap.clientWidth||340)), H=230, L=40, R=6, T=12, B=26;
  const iw=W-L-R, ih=H-T-B;
  const sc=niceMax(Math.max(...vals,0),chartEx);
  const top=sc.top, step=sc.step, slot=iw/n, bw=Math.max(3,slot*0.64);
  chartGeom={W,L,slot,n};
  const stride=Math.max(1,Math.ceil(20/slot));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="${anim?'':'noanim'}" role="img" aria-label="${x.name} 월간 그래프">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${x.color}"/><stop offset="1" stop-color="${x.color2}"/></linearGradient></defs>`;
  for(let v=0;v<=top+0.0001;v+=step){
    const y=T+ih-(v/top)*ih;
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#d3d7e0" ${v===0?'':'stroke-dasharray="4 5"'}/>`;
    s+=`<text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" font-weight="700" fill="#9aa0b8">${chartEx==='plank'?fmtSecAxis(v):fmtNum(v)}</text>`;
  }
  vals.forEach((v,i)=>{
    const d=i+1, cx=L+slot*i+slot/2, k=keyOf(view.y,view.m,d);
    if(k===sel) s+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ih}" rx="5" fill="${x.color}" opacity=".13"/>`;
    if(v>0){
      const h=Math.max(4,(v/top)*ih);
      s+=`<rect class="bar" style="animation-delay:${i*10}ms" x="${cx-bw/2}" y="${T+ih-h}" width="${bw}" height="${h}" rx="${Math.min(5,bw/2)}" fill="url(#g)"/>`;
    }else{
      s+=`<rect x="${cx-bw/2}" y="${T+ih-3}" width="${bw}" height="3" rx="1.5" fill="#cfd4de"/>`;
    }
    if(k===sel||((d-1)%stride===0&&Math.abs(d-sd)>=stride)) s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="${k===sel?800:700}" fill="${k===sel?x.color:(k===todayKey?'#ff6b35':'#9aa0b8')}">${d}</text>`;
  });
  if(sum===0) s+=`<text class="empty" x="${W/2}" y="${T+ih/2}">아직 기록이 없어요 💪</text>`;
  s+='</svg>';
  wrap.innerHTML=s;
}

/* ---------- 화면 전환 ---------- */
function showTab(t){
  tab=t;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='log') centerStrip();
  if(t==='chart') renderChart(true);
  window.scrollTo({top:0,behavior:'instant'});
}
function renderAll(){renderStats();renderStrip(true);renderCalendar();renderEntry();renderChart(true)}
function refreshLive(){renderStats();renderStrip(false);renderCalendar();updateEntryLive();renderChart(false)}
function selectDay(k,anim){
  const [y,m]=k.split('-').map(Number);
  sel=k; view={y,m:m-1};
  renderStats(); renderStrip(true); renderCalendar(); renderEntry(); renderChart(anim);
}

let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
function setView(y,m){
  view={y,m};
  sel=(y===now.getFullYear()&&m===now.getMonth())?todayKey:keyOf(y,m,1);
  renderAll();
}

/* ---------- 이벤트 ---------- */
$('#prev').onclick=()=>{let{y,m}=view;m--;if(m<0){m=11;y--}setView(y,m)};
$('#next').onclick=()=>{let{y,m}=view;m++;if(m>11){m=0;y++}setView(y,m)};
$('#todayBtn').onclick=()=>{view={y:now.getFullYear(),m:now.getMonth()};sel=todayKey;renderAll();showTab('log')};

document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#goLog').onclick=()=>showTab('log');

let stripMoved=false;
$('#strip').addEventListener('click',e=>{
  if(stripMoved){stripMoved=false;return}
  const b=e.target.closest('.sday'); if(!b) return;
  selectDay(b.dataset.k,false);
});
// 마우스로도 끌어서 좌우 스크롤 (터치는 기본 스와이프)
(function(){
  const el=$('#strip'); let down=false,sx=0,sl=0;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') return; down=true;sx=e.clientX;sl=el.scrollLeft;stripMoved=false; });
  window.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-sx;
    if(Math.abs(dx)>5){stripMoved=true;el.classList.add('drag')}
    if(stripMoved) el.scrollLeft=sl-dx;
  });
  window.addEventListener('pointerup',()=>{ if(!down) return; down=false; el.classList.remove('drag'); setTimeout(()=>{stripMoved=false},0); });
})();
$('#cal').addEventListener('click',e=>{
  const b=e.target.closest('.day'); if(!b) return;
  selectDay(b.dataset.k,false); showTab('log');
});
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  chartEx=b.dataset.ex; renderChart(true);
});
$('#seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  chartMetric=b.dataset.m; renderChart(true);
});

// 그래프: 탭 / 좌우 쓸기로 날짜 선택
(function(){
  const wrap=$('#chart'); let down=false;
  function pick(e){
    if(!chartGeom) return;
    const svg=wrap.querySelector('svg'); if(!svg) return;
    const rect=svg.getBoundingClientRect();
    const px=(e.clientX-rect.left)/rect.width*chartGeom.W;
    let i=Math.floor((px-chartGeom.L)/chartGeom.slot);
    i=Math.max(0,Math.min(chartGeom.n-1,i));
    const k=keyOf(view.y,view.m,i+1);
    if(k!==sel) selectDay(k,false);
  }
  wrap.addEventListener('pointerdown',e=>{down=true;pick(e)});
  wrap.addEventListener('pointermove',e=>{if(down)pick(e)});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>wrap.addEventListener(t,()=>{down=false}));
})();

$('#entryBody').addEventListener('input',e=>{
  const inp=e.target; if(!inp.dataset.ex) return;
  applyValue(inp.dataset.ex,inp.dataset.f,parseFloat(inp.value));
});
$('#entryBody').addEventListener('click',e=>{
  const b=e.target.closest('.step button'); if(!b) return;
  const ex=b.dataset.ex, f=b.dataset.f, d=parseFloat(b.dataset.d);
  const inp=document.querySelector(`input[data-ex="${ex}"][data-f="${f}"]`);
  let v=Math.round(((parseFloat(inp.value)||0)+d)*100)/100;
  if(v<0) v=0;
  if(f==='sec'&&v>59) v=59;
  inp.value=v>0?v:'';
  try{navigator.vibrate&&navigator.vibrate(8)}catch(err){}
  applyValue(ex,f,v);
});

$('#clearDay').onclick=()=>{
  if(!data[sel]){toast('지울 기록이 없어요');return}
  if(!confirm('선택한 날짜의 기록을 모두 지울까요?')) return;
  delete data[sel]; save(); renderAll(); toast('기록을 지웠어요');
};

$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='workout-backup-'+todayKey+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      if(typeof obj!=='object'||!obj||Array.isArray(obj)) throw 0;
      if(!confirm('불러온 기록을 현재 기록과 합칩니다(같은 날짜는 불러온 값으로 덮어씀). 계속할까요?')) return;
      Object.assign(data,obj); save(); renderAll(); toast('백업을 불러왔어요');
    }catch(err){toast('올바른 백업 파일이 아니에요')}
  };
  rd.readAsText(file); e.target.value='';
});

let rz; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(tab==='chart') renderChart(false); else centerStrip(); },150)});

renderAll(); setSaveStatus();
})();
</script>
</body>
</html>
